<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سِرب - دردشة مشفرة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0e1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: #1a1f35;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 550px;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }
        .chat-area {
            background: #0d1225;
            border-radius: 10px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
        }
        .message {
            padding: 8px 12px;
            border-radius: 10px;
            margin: 4px 0;
            max-width: 80%;
            word-wrap: break-word;
        }
        .message.me {
            background: #7b2ffc;
            align-self: flex-end;
            margin-left: auto;
        }
        .message.other {
            background: #2d3748;
            align-self: flex-start;
        }
        .message.system {
            text-align: center;
            color: #a0aec0;
            font-size: 13px;
            padding: 5px;
            max-width: 100%;
            background: none;
            align-self: center;
        }
        .message.encrypted {
            border-right: 3px solid #48bb78;
        }
        input, button {
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            outline: none;
        }
        input {
            flex: 1;
            background: #0d1225;
            color: white;
            margin-left: 10px;
        }
        input::placeholder {
            color: #a0aec0;
        }
        button {
            background: #7b2ffc;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        button:hover {
            background: #5a1fb0;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .room-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .room-controls button {
            flex: 1;
            background: #2d3748;
            min-width: 70px;
        }
        .room-controls button:hover {
            background: #4a5568;
        }
        .status {
            color: #a0aec0;
            font-size: 14px;
            text-align: center;
            margin: 5px 0;
            padding: 5px;
            border-radius: 6px;
            background: rgba(0,0,0,0.2);
        }
        .status.secure {
            color: #48bb78;
            background: rgba(72, 187, 120, 0.1);
        }
        .link {
            color: #7b2ffc;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
            text-align: center;
        }
        .link:hover {
            text-decoration: underline;
        }
        .peer-id-box {
            background: #0d1225;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 12px;
            word-break: break-all;
            color: #a0aec0;
            border: 1px solid #2d3748;
        }
        .copy-btn {
            background: #2d3748;
            padding: 3px 10px;
            font-size: 11px;
            border-radius: 4px;
            margin-right: 5px;
        }
        .copy-btn:hover {
            background: #4a5568;
        }
        .key-box {
            background: #0d1225;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #48bb78;
            margin: 5px 0;
            border: 1px solid #48bb78;
            word-break: break-all;
            text-align: center;
        }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            background: #48bb78;
            color: #0a0e1a;
            margin-right: 5px;
        }
        .connect-row {
            display: flex;
            gap: 5px;
            margin: 8px 0;
        }
        .connect-row input {
            flex: 1;
            margin-left: 0;
        }
        .connect-row button {
            flex: 0;
            padding: 10px 15px;
        }
        .flex-center {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .hidden {
            display: none !important;
        }
        .test-btn {
            background: #e53e3e !important;
            margin-top: 10px;
        }
        .test-btn:hover {
            background: #c53030 !important;
        }
        .error-msg {
            color: #fc8181;
            background: rgba(252, 129, 129, 0.1);
            padding: 8px;
            border-radius: 6px;
            margin: 5px 0;
            text-align: center;
            border: 1px solid #fc8181;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin-bottom:5px;">🔐 سِرب - دردشة مشفرة</h2>
        
        <div class="room-controls">
            <button id="createRoomBtn">🆕 إنشاء غرفة</button>
            <button id="joinRoomBtn">🔗 انضم لغرفة</button>
            <button id="disconnectBtn">🚪 قطع الاتصال</button>
        </div>

        <div id="statusDisplay" class="status">🔹 غير متصل</div>

        <!-- منطقة عرض معرفك -->
        <div id="myIdBox" class="peer-id-box hidden">
            <div class="flex-center">
                <strong>🆔 معرفك:</strong> 
                <span id="myPeerId" style="flex:1;color:#63b3ed;">...</span>
                <button id="copyIdBtn" class="copy-btn">📋 نسخ</button>
            </div>
        </div>

        <!-- منطقة عرض المفتاح -->
        <div id="keyBox" class="key-box hidden">
            🔑 <strong>مفتاح التشفير:</strong> <span id="encryptionKey"></span>
        </div>

        <!-- منطقة إدخال معرف الطرف الآخر -->
        <div id="connectBox" class="hidden">
            <div class="connect-row">
                <input type="text" id="targetIdInput" placeholder="أدخل معرف الطرف الآخر">
                <button id="connectBtn">اتصال</button>
            </div>
        </div>

        <div id="chatMessages" class="chat-area">
            <div id="emptyState" style="color:#a0aec0;text-align:center;padding:20px;align-self:center;">
                أنشئ غرفة أو انضم لغرفة مشفرة<br>
                <span style="font-size:12px;">🔐 جميع الرسائل مشفرة</span>
            </div>
        </div>

        <div class="input-row">
            <input type="text" id="messageInput" placeholder="اكتب رسالتك..." disabled>
            <button id="sendBtn" disabled>إرسال</button>
        </div>

        <a href="index.html" class="link">← العودة للهوية</a>
    </div>

    <!-- تحميل مكتبة PeerJS من الإنترنت -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>

    <script>
        // =========================================
        // كود الدردشة المشفرة - نسخة تعمل مع العربية
        // =========================================

        // ===== المتغيرات العامة =====
        let peer = null;
        let connection = null;
        let username = 'مستخدم';
        let isConnected = false;
        let encryptionKey = null;
        let isEncryptionReady = false;

        // ===== تحميل الاسم من الهوية =====
        try {
            const saved = localStorage.getItem('sirb_identity');
            if (saved) {
                const identity = JSON.parse(saved);
                if (identity.name) username = identity.name;
            }
        } catch(e) {}

        // ===== عناصر الواجهة =====
        const chatArea = document.getElementById('chatMessages');
        const emptyState = document.getElementById('emptyState');
        const msgInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDisplay = document.getElementById('statusDisplay');
        const myIdBox = document.getElementById('myIdBox');
        const myPeerId = document.getElementById('myPeerId');
        const connectBox = document.getElementById('connectBox');
        const targetIdInput = document.getElementById('targetIdInput');
        const keyBox = document.getElementById('keyBox');
        const encryptionKeyDisplay = document.getElementById('encryptionKey');

        // =========================================
        // دوال التشفير (تدعم العربية)
        // =========================================

        function generateKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let key = '';
            for (let i = 0; i < 32; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        }

        // تشفير النص مع دعم العربية
        function encryptText(text, key) {
            // تحويل النص إلى UTF-8 ثم إلى Base64
            const utf8Bytes = new TextEncoder().encode(text);
            let binary = '';
            for (let i = 0; i < utf8Bytes.length; i++) {
                binary += String.fromCharCode(utf8Bytes[i]);
            }
            const base64 = btoa(binary);
            
            // تشفير النص المشفر بالمفتاح
            let encrypted = '';
            for (let i = 0; i < base64.length; i++) {
                const charCode = base64.charCodeAt(i);
                const keyChar = key.charCodeAt(i % key.length);
                encrypted += String.fromCharCode(charCode ^ keyChar);
            }
            return btoa(encrypted);
        }

        // فك تشفير النص مع دعم العربية
        function decryptText(encryptedBase64, key) {
            try {
                // فك التشفير الأساسي
                const encrypted = atob(encryptedBase64);
                let decrypted = '';
                for (let i = 0; i < encrypted.length; i++) {
                    const charCode = encrypted.charCodeAt(i);
                    const keyChar = key.charCodeAt(i % key.length);
                    decrypted += String.fromCharCode(charCode ^ keyChar);
                }
                
                // فك Base64
                const base64 = atob(decrypted);
                
                // تحويل من UTF-8 إلى نص
                const bytes = new Uint8Array(base64.length);
                for (let i = 0; i < base64.length; i++) {
                    bytes[i] = base64.charCodeAt(i);
                }
                return new TextDecoder().decode(bytes);
            } catch(e) {
                console.error('خطأ في فك التشفير:', e);
                return '[❌ خطأ في فك التشفير]';
            }
        }

        // ===== دوال عرض الرسائل =====
        function displayMessage(text, sender, isMe, isEncrypted = false) {
            if (emptyState) emptyState.style.display = 'none';

            const div = document.createElement('div');
            div.className = 'message ' + (isMe ? 'me' : 'other');
            if (isEncrypted) {
                div.classList.add('encrypted');
            }
            const senderLabel = isMe ? 'أنت' : sender;
            const badge = isEncrypted ? '<span class="badge">🔒</span> ' : '';
            div.innerHTML = `<strong>${senderLabel}</strong><br>${badge}${text}`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addSystemMessage(text) {
            if (emptyState) emptyState.style.display = 'none';

            const div = document.createElement('div');
            div.className = 'message system';
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function setStatus(text, isSecure = false) {
            statusDisplay.textContent = text;
            statusDisplay.className = 'status';
            if (isSecure) {
                statusDisplay.classList.add('secure');
            }
        }

        // ===== دوال PeerJS =====
        function createRoom() {
            if (peer) {
                peer.destroy();
                peer = null;
            }
            
            encryptionKey = generateKey();
            encryptionKeyDisplay.textContent = encryptionKey;
            keyBox.classList.remove('hidden');
            isEncryptionReady = true;
            
            peer = new Peer({
                debug: 0,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', function(id) {
                myPeerId.textContent = id;
                myIdBox.classList.remove('hidden');
                connectBox.classList.remove('hidden');
                setStatus(`✅ جاهز! معرفك: ${id}`, true);
                addSystemMessage(`🎉 تم إنشاء غرفة مشفرة!`);
                addSystemMessage(`🔑 المفتاح: ${encryptionKey}`);
                addSystemMessage(`📋 انسخ المعرف والمفتاح وأرسلهما للآخر`);
                msgInput.disabled = true;
                sendBtn.disabled = true;
            });

            peer.on('connection', function(conn) {
                connection = conn;
                setupConnection(conn, true);
                addSystemMessage(`🔗 شخص ما يتصل بك...`);
            });

            peer.on('error', function(err) {
                console.error('خطأ:', err);
                addSystemMessage(`❌ خطأ: ${err.message}`);
            });
        }

        function joinRoom() {
            if (peer) {
                peer.destroy();
                peer = null;
            }
            
            const key = prompt('🔑 أدخل مفتاح التشفير الذي أعطاك إياه الطرف الآخر:');
            if (!key || key.length < 10) {
                addSystemMessage('⚠️ مفتاح غير صحيح، حاول مرة أخرى');
                return;
            }
            encryptionKey = key;
            encryptionKeyDisplay.textContent = encryptionKey;
            keyBox.classList.remove('hidden');
            isEncryptionReady = true;
            
            peer = new Peer({
                debug: 0,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', function(id) {
                myPeerId.textContent = id;
                myIdBox.classList.remove('hidden');
                connectBox.classList.remove('hidden');
                setStatus(`✅ جاهز! معرفك: ${id}`, true);
                addSystemMessage(`🎉 أنت جاهز للاتصال المشفر!`);
                addSystemMessage(`🔑 المفتاح: ${encryptionKey}`);
                addSystemMessage(`📋 أدخل معرف الطرف الآخر و اضغط "اتصال"`);
                msgInput.disabled = true;
                sendBtn.disabled = true;
            });

            peer.on('error', function(err) {
                console.error('خطأ:', err);
                addSystemMessage(`❌ خطأ: ${err.message}`);
            });
        }

        function connectToPeer() {
            const targetId = targetIdInput.value.trim();
            if (!targetId) {
                addSystemMessage('⚠️ أدخل معرف الطرف الآخر');
                return;
            }

            if (!peer) {
                addSystemMessage('⚠️ أنشئ غرفة أولاً');
                return;
            }

            if (!isEncryptionReady || !encryptionKey) {
                addSystemMessage('⚠️ مفتاح التشفير غير جاهز');
                return;
            }

            addSystemMessage(`🔗 جاري الاتصال المشفر بـ ${targetId}...`);
            
            const conn = peer.connect(targetId);
            setupConnection(conn, false);
        }

        function setupConnection(conn, isHost) {
            connection = conn;
            
            conn.on('open', function() {
                isConnected = true;
                setStatus('✅ متصل! (مشفر)', true);
                msgInput.disabled = false;
                sendBtn.disabled = false;
                connectBox.classList.add('hidden');
                addSystemMessage('🎉 تم الاتصال! الدردشة مشفرة بالكامل 🔐');
                addSystemMessage(`🔑 المفتاح: ${encryptionKey}`);
                
                const encryptedName = encryptText(username, encryptionKey);
                conn.send({
                    type: 'join',
                    sender: encryptedName
                });
            });

            conn.on('data', function(data) {
                try {
                    if (data.type === 'message') {
                        const decryptedText = decryptText(data.text, encryptionKey);
                        const decryptedSender = decryptText(data.sender, encryptionKey);
                        displayMessage(decryptedText, decryptedSender, false, true);
                    } else if (data.type === 'join') {
                        const decryptedSender = decryptText(data.sender, encryptionKey);
                        addSystemMessage(`👋 ${decryptedSender} انضم للدردشة المشفرة 🔐`);
                    }
                } catch(e) {
                    console.error('خطأ في فك التشفير:', e);
                    addSystemMessage('⚠️ استلمت رسالة غير قابلة للفك');
                }
            });

            conn.on('close', function() {
                isConnected = false;
                setStatus('❌ تم قطع الاتصال', false);
                msgInput.disabled = true;
                sendBtn.disabled = true;
                connectBox.classList.remove('hidden');
                addSystemMessage('🚪 تم قطع الاتصال');
            });

            conn.on('error', function(err) {
                addSystemMessage(`❌ خطأ في الاتصال: ${err.message}`);
            });
        }

        // ===== إرسال رسالة =====
        function sendMessage() {
            console.log('🔵 زر الإرسال تم الضغط عليه!');

            const text = msgInput.value.trim();
            if (!text) {
                addSystemMessage('⚠️ اكتب رسالة أولاً');
                return;
            }
            if (!connection || !isConnected) {
                addSystemMessage('⚠️ أنت غير متصل بأي شخص');
                return;
            }
            if (!isEncryptionReady || !encryptionKey) {
                addSystemMessage('⚠️ مفتاح التشفير غير جاهز');
                return;
            }

            console.log('📤 جاري إرسال الرسالة:', text);

            try {
                // تشفير الرسالة
                const encryptedText = encryptText(text, encryptionKey);
                const encryptedSender = encryptText(username, encryptionKey);

                // إرسال للطرف الآخر
                connection.send({
                    type: 'message',
                    text: encryptedText,
                    sender: encryptedSender
                });

                // عرض عندنا
                displayMessage(text, username, true, true);
                msgInput.value = '';
                msgInput.focus();
                
                console.log('✅ تم إرسال الرسالة بنجاح');
            } catch(e) {
                console.error('❌ خطأ في الإرسال:', e);
                addSystemMessage(`❌ خطأ في الإرسال: ${e.message}`);
            }
        }

        // ===== قطع الاتصال =====
        function disconnect() {
            if (connection) {
                connection.close();
                connection = null;
            }
            if (peer) {
                peer.destroy();
                peer = null;
            }
            isConnected = false;
            isEncryptionReady = false;
            encryptionKey = null;
            setStatus('🔹 غير متصل', false);
            msgInput.disabled = true;
            sendBtn.disabled = true;
            myIdBox.classList.add('hidden');
            connectBox.classList.add('hidden');
            keyBox.classList.add('hidden');
            if (emptyState) emptyState.style.display = 'block';
            addSystemMessage('🚪 تم قطع الاتصال');
        }

        // ===== نسخ المعرف =====
        function copyMyId() {
            const id = myPeerId.textContent;
            if (!id || id === '...') {
                addSystemMessage('⚠️ لا يوجد معرف لنسخه');
                return;
            }
            navigator.clipboard.writeText(id).then(() => {
                addSystemMessage('📋 تم نسخ المعرف');
            }).catch(() => {
                const input = document.createElement('input');
                input.value = id;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                addSystemMessage('📋 تم نسخ المعرف');
            });
        }

        // =========================================
        // ربط الأزرار
        // =========================================

        window.onload = function() {
            console.log('🔐 سِرب مشفرة جاهزة!');
            console.log('✅ تدعم اللغة العربية الآن');
            
            // الأزرار الرئيسية
            document.getElementById('createRoomBtn').onclick = createRoom;
            document.getElementById('joinRoomBtn').onclick = joinRoom;
            document.getElementById('disconnectBtn').onclick = disconnect;
            document.getElementById('connectBtn').onclick = connectToPeer;
            document.getElementById('copyIdBtn').onclick = copyMyId;
            
            // زر الإرسال
            sendBtn.onclick = function() {
                console.log('🟢 زر الإرسال نقر (onclick)');
                sendMessage();
            };
            
            // إرسال بالضغط على Enter
            msgInput.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    console.log('🟢 Enter تم الضغط عليه');
                    e.preventDefault();
                    sendMessage();
                }
            };
            
            // إرسال بالضغط على Enter في حقل المعرف
            targetIdInput.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    connectToPeer();
                }
            };
            
            console.log('✅ جميع الأزرار ربطت بنجاح');
            console.log('📝 اكتب رسالة بالعربية واضغط Enter أو زر إرسال');
            addSystemMessage('✅ النظام جاهز! يمكنك كتابة رسائل بالعربية');
        };
    </script>
</body>
</html>
